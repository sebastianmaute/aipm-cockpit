stages:
  - install
  - quality
  - build
  - e2e

default:
  image: node:20-bookworm-slim          # glibc, compatible with the Playwright image
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull

# Run on merge requests, the default branch, and tags — but avoid duplicate
# branch+MR pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"   # weekly full dependency audit

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"
  # NOTE: do NOT set NODE_ENV=production here — it strips devDependencies
  # (vitest, eslint, typescript, @playwright/test) and breaks every other job.

install:
  stage: install
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push                    # this job populates the cache
  script:
    - npm ci
  artifacts:
    paths: [node_modules/]
    expire_in: 1h

lint:
  stage: quality
  needs: [install]
  script:
    - npm run lint

typecheck:
  stage: quality
  needs: [install]
  script:
    - npx tsc --noEmit

# SAST — BLOCKING as of Phase 4 (was warn-only allow_failure in Phase 1). Runs in
# Semgrep's own image, needs no node_modules → needs: []. Emits GitLab-native SAST
# format so findings populate the MR security widget + pipeline "Security" tab +
# Vulnerability Report (those UI surfaces require the GitLab Ultimate tier; on
# lower tiers the report is still downloadable as an artifact and the job log
# prints the findings table). `--error` makes the job FAIL on findings (removed
# the Phase-1 "no --error" report-only posture) so it gates; `--severity ERROR`
# scopes the gate to high-severity findings only (warning/info still report via
# the widget artifact but do not block).
# Emergency bypass: MR label "quality-gate-bypass" + mandatory follow-up ticket
# (enable the rules block below to activate the label mechanism).
#   rules:
#     - if: $CI_MERGE_REQUEST_LABELS =~ /quality-gate-bypass/
#       allow_failure: true
#     - when: on_success
semgrep:
  stage: quality
  needs: []
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config p/typescript --config p/react --config p/owasp-top-ten
        --gitlab-sast --output gl-sast-report.json --error --severity ERROR .
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths: [gl-sast-report.json]
    expire_in: 1 week

# Blocking audit of production dependencies. Currently 0 vulns at every level
# (measured 2026-07-02), so this cannot break existing MRs — it guards against
# a NEW high/critical CVE landing between merges.
dependency-audit:
  stage: quality
  needs: [install]
  script:
    - npm audit --omit=dev --audit-level=high

# Weekly full audit (all severities, incl. dev deps) via a GitLab pipeline
# schedule. Warn-only: informational, not a merge gate.
dependency-audit-full:
  stage: quality
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  script:
    - npm audit --audit-level=low

unit-tests:
  stage: quality
  needs: [install]
  script:
    - npm run test:coverage -- --reporter=default --reporter=junit --outputFile=junit.xml
  coverage: '/All files\s+\|\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths: [coverage/]
    expire_in: 1 week

# File-size ratchet — BLOCKING as of Phase 4 (was warn-only allow_failure).
# Freezes the oversized files at their current size and blocks new oversized
# files (>800 lines, i18n dictionaries exempt). Regenerate the baseline with
# `node scripts/check-file-sizes.mjs --update` when a decomposition legitimately
# lowers a file below the limit.
# Emergency bypass: MR label "quality-gate-bypass" + mandatory follow-up ticket.
#   rules:
#     - if: $CI_MERGE_REQUEST_LABELS =~ /quality-gate-bypass/
#       allow_failure: true
#     - when: on_success
file-size-ratchet:
  stage: quality
  needs: []
  script:
    - npm run size:check

build:
  stage: build
  needs: [install]
  script:
    - npm run build                      # also runs the prebuild docs-sync check
  artifacts:
    paths: [.next/]
    expire_in: 1h

# E2E runs on merge requests and the default branch (main). It's the slowest
# job, so it gates MRs at the cost of a longer MR pipeline.
e2e:
  stage: e2e
  # Keep this tag in lockstep with @playwright/test in package-lock.json. The
  # `npx playwright install` below is a safety net: if the resolved client ever
  # drifts from the image, it downloads the matching browser instead of failing.
  image: mcr.microsoft.com/playwright:v1.60.0-jammy
  needs: [build]
  dependencies: []                       # fresh install — don't reuse glibc-mismatched modules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npx playwright install chromium     # ensure the browser matches the installed client
    - npm run e2e
  artifacts:
    when: always
    paths: [playwright-report/]
    expire_in: 1 week

# DAST — OWASP ZAP baseline scan against the running app.
#
# ★★ UNVALIDATED LOCALLY (no Docker on the authoring box) — verify on the first
# manual run and adjust for this project's runner. Requires a DOCKER-IN-DOCKER
# capable runner (privileged mode / the `docker`+`dind` tag). If the runners
# can't do dind, the alternative is GitLab's DAST analyzer pointed at a deployed
# review-app (needs a deploy stage this pipeline doesn't have yet).
#
# Runs only on the weekly SCHEDULE and on MANUAL trigger — DAST is slow and
# infra-heavy, not something to gate every MR on. allow_failure so a scan hiccup
# never blocks. Publishes the ZAP HTML + JSON as plain artifacts (raw ZAP JSON is
# NOT GitLab's `gl-dast-report.json` schema, so it does NOT populate the Security
# tab widget — that needs the GitLab DAST analyzer + a deployed target).
dast-zap:
  stage: e2e
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # Build + run the app, then scan it from a sibling ZAP container on a shared
    # docker network (so ZAP reaches the app at http://app:3000).
    - docker build -t lop-app-dast -f Dockerfile.dast .
    - docker network create dastnet
    - docker run -d --name app --network dastnet lop-app-dast
    - |
      echo "waiting for app to accept connections…"
      for i in $(seq 1 60); do
        if docker run --rm --network dastnet curlimages/curl -sf http://app:3000 >/dev/null 2>&1; then
          echo "app is up"; break
        fi
        sleep 3
      done
    # -I = do not fail the job on warn/alert (allow_failure already covers infra).
    - |
      docker run --rm --network dastnet -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py -t http://app:3000 -I -r zap-report.html -J zap-report.json || true
  artifacts:
    when: always
    paths: [zap-report.html, zap-report.json]
    expire_in: 1 week
