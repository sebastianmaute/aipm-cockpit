stages:
  - install
  - quality
  - build
  - e2e
  # Tag pipelines only: publishes the Release that points at e2e's installer.
  # A separate stage rather than a `needs:` inside e2e, so the ordering is
  # visible in the pipeline graph and does not depend on same-stage needs --
  # and, more to the point, so STAGE ORDER is what makes publish-release wait
  # on every earlier-stage gate before it runs (Task 7).
  - release

default:
  image: node:24-bookworm-slim          # Debian/glibc (not alpine/musl); node 20 went EOL 2026-04-30
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull

# Run on merge requests, the default branch, and tags — but avoid duplicate
# branch+MR pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"   # weekly full dependency audit

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"
  # NOTE: do NOT set NODE_ENV=production here — it strips devDependencies
  # (vitest, eslint, typescript, @playwright/test) and breaks every other job.

install:
  stage: install
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push                    # this job populates the cache
  script:
    - npm ci
  artifacts:
    paths: [node_modules/]
    expire_in: 1h

lint:
  stage: quality
  needs: [install]
  script:
    - npm run lint

typecheck:
  stage: quality
  needs: [install]
  script:
    - npx tsc --noEmit

# SAST — BLOCKING as of Phase 4 (was warn-only allow_failure in Phase 1). Runs in
# Semgrep's own image, needs no node_modules → needs: []. TWO scans, on purpose:
#   1. FULL-severity scan → gl-sast-report.json. Exits 0 (native SAST, no --error)
#      so it never blocks by itself; its job is VISIBILITY — ALL findings (error/
#      warning/info) populate the MR security widget + pipeline "Security" tab +
#      Vulnerability Report (those UI surfaces need GitLab Ultimate; on lower tiers
#      the report is a downloadable artifact + the job log prints the table). This
#      preserves the Phase-1 all-severity reporting.
#   2. GATE scan, ERROR-severity only, `--error` → the job FAILS on high-severity
#      findings. `--severity ERROR` scopes ONLY the gate; because it is a SEPARATE
#      scan, it does NOT narrow the report above (warning/info stay visible via
#      scan 1). Blocking on ERROR only (not all severities) avoids failing the
#      pipeline on the large volume of WARNING-level owasp/react/ts rules.
# Emergency bypass: MR label "quality-gate-bypass" + mandatory follow-up ticket
# (enable the rules block below to activate the label mechanism).
#   rules:
#     - if: $CI_MERGE_REQUEST_LABELS =~ /quality-gate-bypass/
#       allow_failure: true
#     - when: on_success
semgrep:
  stage: quality
  needs: []
  image: semgrep/semgrep:latest
  script:
    # 1. Full-severity report (all findings → widget; non-gating).
    - semgrep scan --config p/typescript --config p/react --config p/owasp-top-ten
        --gitlab-sast --output gl-sast-report.json .
    # 2. Gate: fail only on ERROR-severity findings.
    - semgrep scan --config p/typescript --config p/react --config p/owasp-top-ten
        --severity ERROR --error .
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths: [gl-sast-report.json]
    expire_in: 1 week

# Blocking audit of production dependencies. Currently 0 vulns at every level
# (measured 2026-07-02), so this cannot break existing MRs — it guards against
# a NEW high/critical CVE landing between merges.
dependency-audit:
  stage: quality
  needs: [install]
  script:
    - npm audit --omit=dev --audit-level=high

# Weekly full audit (all severities, incl. dev deps) via a GitLab pipeline
# schedule. Warn-only: informational, not a merge gate.
dependency-audit-full:
  stage: quality
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  script:
    - npm audit --audit-level=low

unit-tests:
  stage: quality
  needs: [install]
  script:
    - npm run test:coverage -- --reporter=default --reporter=junit --outputFile=junit.xml
  coverage: '/All files\s+\|\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths: [coverage/]
    expire_in: 1 week

# Order-dependence gate. Runs the unit suite with vitest's shuffle at a PINNED
# seed, so a red run is REPRODUCIBLE — the same commit shuffles the same way
# every time, and `npm run test:shuffle` reproduces it locally.
#
# ★★ It is NOT true that "only a real regression can turn this red", which an
# earlier version of this comment claimed. The seed pins the PRNG, not the
# permutation: the shuffle is a permutation of the CURRENT test array, so
# adding or removing any test anywhere changes the resulting order. (Renaming a
# test does NOT: the permutation is over array POSITIONS, so a renamed test keeps
# its index. An earlier version of this line said "renaming" too — an over-claim
# inside the sentence that corrects an over-claim.)
# An MR that merely adds an unrelated test can therefore expose a PRE-EXISTING
# latent order dependence and go red without having introduced anything — §75
# documents 38 undrained `*Once()` queues on `mockBackend` that are exactly such
# latents. (`*Once()`, the whole family — mostly `mockResolvedValueOnce`. An
# earlier version said "38 `mockReturnValueOnce` calls"; there are 3 of those on
# `mockBackend`, so an operator who greps that name concludes the register is
# stale.) Read a red run as "an order dependence exists somewhere in the suite",
# not "this MR caused it", and bisect with `npm run test:shuffle`.
#
# Seed 1 is the seed that reproduced the two leaks closed in open-followups §75
# (a leaked `window.matchMedia` stub, an undrained `mockReturnValueOnce` queue).
#
# ★★ `needs` includes `unit-tests` ON PURPOSE. No other quality-stage job lists
# `unit-tests` in its own `needs` — most need at most `install` (lint,
# typecheck, dependency-audit, dependency-audit-full, duplication-gate) or
# nothing at all (semgrep, file-size-ratchet, agents-symbol-check), and
# `unit-tests-shuffled-random` chains behind THIS job rather than `install`
# (see its own comment below) — so absent this dependency GitLab would run
# this job concurrently with `unit-tests`, meaning two full vitest processes
# contending for the runner's CPU at once. That is the same class of resource
# contention as the full-suite parallel-load worker starvation (see AGENTS.md's
# `npm run test:run` note, and open-followups §51's amplification note).
#
# ★ What the edge buys is BOUNDED, and overstating it is how the next person
# talks themselves into deleting it. It removes the worst single contender,
# not all of them: `build` and `duplication-gate` both need only `install`, so
# a full `next build` and a jscpd run still overlap this job — and jscpd
# running concurrently with a vitest run is the documented cause of a
# `test:coverage` exit 1 with every test passing. Serialising the two full
# vitest runs costs pipeline wall-clock (each MR now pays two unit runs that
# cannot overlap) and removes the largest source of contention. It does not
# make the stage contention-free.
#
# ★ Because `needs` requires success, a red `unit-tests` SKIPS this job
# entirely — the order-dependence gate goes quiet exactly when the suite is
# already unstable. Accepted: a shuffled run against a suite that is failing
# unshuffled would not be readable anyway.
#
# ★ No coverage here: `unit-tests` owns the floors, and instrumenting a second
# full run doubles the cost of the runs we just argued must not contend.
# ★ `--reporter=basic` does NOT exist in vitest 4.1.8 (errors at startup).
unit-tests-shuffled:
  stage: quality
  needs:
    - install
    - job: unit-tests
      artifacts: false
  script:
    # Calls the npm script rather than repeating the flags, so the gate and its
    # documented local reproduction cannot drift apart. Nothing would have caught
    # a mismatch: they were identical strings in two files with no gate over the
    # pair, while AGENTS.md told contributors `test:shuffle` reproduces this job.
    - npm run test:shuffle

# Weekly random-seed sweep via a GitLab pipeline schedule. The pinned job above
# proves seed 1 stays green; this one samples the class instead of pinning one
# point of it. Warn-only: informational, not a merge gate.
#
# ★★ The seed is `$CI_PIPELINE_ID` and is echoed with its reproduce command. A
# random-seed failure whose seed was not recorded is unreproducible, which costs
# the reader's attention and returns nothing. `$RANDOM` was the obvious choice
# and is WRONG: it is a bash builtin, the runner shell on node:24-bookworm-slim
# is not guaranteed to be bash, and under sh it expands to empty — yielding a
# malformed `--sequence.seed=` on the one job whose entire value is a recorded
# seed. `$CI_PIPELINE_ID` is always present, needs no shell features, and is
# unique per pipeline.
unit-tests-shuffled-random:
  stage: quality
  # Chained behind unit-tests-shuffled (not just install) so a schedule
  # pipeline — the one place all three vitest jobs are live — never runs two
  # of them concurrently. unit-tests-shuffled has no rules: of its own, so it
  # is present on every pipeline and this dependency always resolves.
  needs:
    - install
    - job: unit-tests-shuffled
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  script:
    - 'echo "shuffle seed=$CI_PIPELINE_ID  (reproduce: npx vitest run --sequence.shuffle --sequence.seed=$CI_PIPELINE_ID)"'
    - npm run test:run -- --sequence.shuffle --sequence.seed=$CI_PIPELINE_ID --reporter=dot

# File-size ratchet — BLOCKING as of Phase 4 (was warn-only allow_failure).
# Freezes the oversized files at their baselined size and blocks new oversized
# files (over the LIMIT in scripts/check-file-sizes.mjs — 1600 since 2026-09-03,
# doubled from 800 along with every baseline entry; i18n dictionaries exempt).
# ★★★ DO NOT regenerate the baseline with `node scripts/check-file-sizes.mjs
# --update` to make this job pass. It rewrites the baseline to CURRENT sizes and
# DROPS every entry now under the LIMIT, discarding the deliberate doubling —
# three of the four entries would vanish outright. The gate's own failure
# message still recommends it; that advice predates the doubling.
# Emergency bypass: MR label "quality-gate-bypass" + mandatory follow-up ticket.
#   rules:
#     - if: $CI_MERGE_REQUEST_LABELS =~ /quality-gate-bypass/
#       allow_failure: true
#     - when: on_success
file-size-ratchet:
  stage: quality
  needs: []
  script:
    - npm run size:check

# AGENTS.md symbol check — BLOCKING. Nothing else gates that file, and a false
# symbol name there does not stay in the doc: `migrateTaskStatus` (a function
# that never existed) was read by three contributors in one release, each of
# whom grepped src/, found nothing to contradict it, and wrote the claim into
# code comments and a commit message. This checks only that a named symbol is
# real, never that a claim about it is true.
# A symbol that is deliberately absent (a prohibition, a rejected design, a
# retired module) is fine — say so NEAR the mention with one of the words in the
# script's ABSENCE_MARKERS list. Genuinely-not-repo-code goes in its ALLOWLIST
# with a reason. Never widen either to make a pipeline pass.
agents-symbol-check:
  stage: quality
  needs: []
  script:
    - npm run docs:symbols:check

# Version-sync gate — BLOCKING. src/app/version.ts is the source of truth for
# the app version and codename; every file in SATELLITES in
# scripts/version-sync-lib.mjs restates one or both, and nothing compared them
# until this job. Read the list there (grep -n 'file: "' scripts/version-sync-lib.mjs),
# not here: the enumeration this comment used to carry missed
# desktop/package.json and desktop/package-lock.json. They have drifted
# silently before — package.json six releases behind, package-lock.json
# eleven, while version.ts and CHANGELOG.md were correct.
# Propagate rather than hand-editing each one: npm run version:sync
version-sync-check:
  stage: quality
  needs: []
  script:
    - npm run version:check

# Doc-claims ratchet — BLOCKING. Fails when a doc gains a NEW `path:LINE`
# citation, or cites a line that cannot exist. It is the enforcement AGENTS.md's
# three-star "CITE THE SYMBOL, NOT A LINE RANGE" rule never had: on 2026-08-09 a
# 10-line comment insertion in src/proxy.ts silently repointed NINE proxy.ts:NN
# citations across two tracked files — FOUR of them inside
# docs/security/threat-model.md — every one of which had been exact.
# ★★ It CANNOT verify a citation still points at the right code; nothing can,
# because the doc never records what was supposed to be there. It proves only
# that the line could exist and that the count is not growing. Do not read a
# green run as "the citations are correct".
# Pre-existing breakage is grandfathered in docs/baselines/doc-line-cites.json.
# Re-baseline ONLY when citations are removed or converted to symbols:
#   node scripts/check-doc-claims.mjs --update
# Never re-baseline to admit a new one — that is the whole thing being gated.
doc-claims-check:
  stage: quality
  needs: []
  script:
    - npm run docs:claims:check

# Status-line contract — BLOCKING. Every OPEN entry in docs/open-followups.md
# must carry a `**Status:**` line with an ISO date that either cites a command
# or says `never machine-verified`. 118 of 175 open entries had no such line on
# 2026-08-28 and nothing had ever checked, which is how it got to 118.
# TWO FAILURE MODES, TWO EXIT CODES: 1 is DRIFT (write the Status line); 2 means
# the gate could not scan at all — an unreadable register, or too few entries
# parsed (the floor is 50, not zero: a scan that reads ALMOST nothing would
# otherwise pass ALMOST everything). 2 is the load-bearing
# one. Do NOT satisfy a red run by inventing a verification: `never
# machine-verified` is a conforming answer and is the honest one for an entry
# nobody has probed.
followups-status-check:
  stage: quality
  needs: []
  script:
    - npm run followups:status:check

# Index contract — BLOCKING. docs/open-followups.md carries an index table AND a
# body of `## <n>.` entry headings, and nothing compared the two sets until this
# gate: on the day it was written the register held 413 headings against 405
# rows, so eight entries were invisible to anyone reading the index.
# TWO FAILURE MODES, TWO EXIT CODES: 1 is DRIFT — write the missing rows between
# the markers, or delete a row whose entry is gone. NEVER satisfy it by
# renumbering an entry: a follow-up number is a permanent handle that other docs
# cite, so a renumber silently redirects every citation. 2 means the gate could
# not scan at all — an unreadable or unparseable register, or fewer than 50 on
# either axis (a scan that reads ALMOST nothing would otherwise pass ALMOST
# everything). 2 is the load-bearing one.
followups-index-check:
  stage: quality
  needs: []
  script:
    - npm run followups:index:check

# Work item contract — BLOCKING. Every OPEN entry in docs/open-followups.md must
# carry exactly one line starting `**Work item:**` whose remainder is `#NN` or
# exactly `none — decision record`; a closed entry carries none, and no GitLab
# issue may be claimed by two open entries. It reads the register ONLY, so it
# cannot see an issue closed in GitLab.
# TWO FAILURE MODES, TWO EXIT CODES: 1 is DRIFT (fix the line); 2 means the gate
# could not scan at all — an unreadable register, or fewer than 50 open entries
# parsed. 2 is the load-bearing one. Do NOT satisfy a red run with
# `none — decision record` on an entry that has real work; create the issue.
followups-workitems-check:
  stage: quality
  needs: []
  script:
    - npm run followups:workitems:check

# Duplication gate — BLOCKING as of Phase 4 (ratchet, not absolute). jscpd exits
# non-zero if any format's duplication % exceeds the `--threshold` set in the
# `dup:check` script (post-TD-6 exit level: tsx 1.69% / typescript 1.71% [binding]
# + headroom = 1.75, after the PanelTableScaffold structural slice dropped tsx
# 1.72→1.69 and flipped the binding to typescript). Further gate movement now needs
# a TYPESCRIPT-side reduction (the tsx panel-shell seam is spent); the remaining gap
# to the ≤50%-baseline goal is structural work (toolbar unification, Jira/Turso ts).
# Ratchet the threshold DOWN in package.json as duplication falls; never raise it
# to make a PR pass. Emergency bypass: MR label "quality-gate-bypass" + follow-up.
duplication-gate:
  stage: quality
  needs: [install]
  script:
    - npm run dup:check

# Tag pipelines only: refuse a tag that disagrees with src/app/version.ts.
#
# ★ needs: [] so it runs IMMEDIATELY, without waiting for the rest of the
# quality stage.
# ★★ desktop-package-tag lists THIS job in its own needs: (see the comment on
# that job), so the wine build waits for this guard instead of racing it. That
# a FAILED guard then SKIPS the build is expected needs: behaviour, but no
# GitLab doc checked here states it and no tag pipeline has shown it.
# publish-release is held back either way: it sits in a later stage with the
# default when: on_success (see the comment on that job).
# ★★★ No allow_failure. Publishing an installer that misreports its own version
# is the whole failure this prevents.
tag-version-check:
  stage: quality
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm run tag:check

build:
  stage: build
  needs: [install]
  script:
    - npm run build                      # also runs the prebuild docs-sync check
  artifacts:
    paths: [.next/]
    expire_in: 1h

# E2E runs on merge requests and the default branch (main). It's the slowest
# job, so it gates MRs at the cost of a longer MR pipeline.
e2e:
  stage: e2e
  # Keep this tag in lockstep with @playwright/test in package-lock.json. The
  # `npx playwright install` below is a safety net: if the resolved client ever
  # drifts from the image, it downloads the matching browser instead of failing.
  image: mcr.microsoft.com/playwright:v1.61.1-jammy
  needs: [build]
  dependencies: []                       # fresh install — don't reuse glibc-mismatched modules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npx playwright install chromium     # ensure the browser matches the installed client
    - npm run e2e
  artifacts:
    when: always
    paths: [playwright-report/]
    expire_in: 1 week

# Prod-CSP smoke — the gate that would have caught open-followups §54.
#
# ★★ The unit suite CANNOT see this class and neither can `e2e`. The dev CSP
# grants 'unsafe-inline' on style-src-elem while prod is nonce-only
# (src/proxy.ts), and `npm run e2e:smoke` starts no server — so in practice it
# only ever met the permissive dev policy. A prod-only defect that made every
# rich-text editor render unstyled shipped unnoticed for months behind exactly
# that gap.
#
# Takes the .next/ artifact `build` publishes. The `e2e` job's `dependencies: []`
# precaution does not apply here: that exists to avoid reusing glibc-mismatched
# node_modules, and `build` publishes only .next/, which is not node_modules.
prod-smoke:
  stage: e2e
  # ★ SECOND copy of the playwright image tag — `e2e:` above carries the same one
  # and the "keep it in lockstep with @playwright/test" note. Bump BOTH together.
  image: mcr.microsoft.com/playwright:v1.61.1-jammy
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npx playwright install chromium
    - npm run e2e:smoke:prod

# DAST — OWASP ZAP baseline scan against the running app.
#
# ★★ UNVALIDATED LOCALLY (no Docker on the authoring box) — verify on the first
# manual run and adjust for this project's runner. Requires a DOCKER-IN-DOCKER
# capable runner (privileged mode / the `docker`+`dind` tag). If the runners
# can't do dind, the alternative is GitLab's DAST analyzer pointed at a deployed
# review-app (needs a deploy stage this pipeline doesn't have yet).
#
# Runs only on the weekly SCHEDULE and on MANUAL trigger — DAST is slow and
# infra-heavy, not something to gate every MR on. allow_failure so a scan hiccup
# never blocks. Publishes the ZAP HTML + JSON as plain artifacts (raw ZAP JSON is
# NOT GitLab's `gl-dast-report.json` schema, so it does NOT populate the Security
# tab widget — that needs the GitLab DAST analyzer + a deployed target).
dast-zap:
  stage: e2e
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # ★★ On a tag pipeline, publish-release (release stage) relies on THIS allow_failure staying true, or the tag pipeline never leaves e2e.
    - when: manual
      allow_failure: true
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # Build + run the app, then scan it from a sibling ZAP container on a shared
    # docker network (so ZAP reaches the app at http://app:3000).
    - docker build -t aipm-cockpit-dast -f Dockerfile.dast .
    - docker network create dastnet
    - docker run -d --name app --network dastnet aipm-cockpit-dast
    - |
      echo "waiting for app to accept connections…"
      for i in $(seq 1 60); do
        if docker run --rm --network dastnet curlimages/curl -sf http://app:3000 >/dev/null 2>&1; then
          echo "app is up"; break
        fi
        sleep 3
      done
    # -I = do not fail the job on warn/alert.
    # ★★ NOT "allow_failure already covers infra" — that was wrong. allow_failure
    # is on the `when: manual` rule ONLY; the `schedule` rule above omits it and a
    # rules entry without allow_failure defaults to FALSE. So on the weekly
    # schedule this job is BLOCKING, and an infra failure (docker build, or
    # `network create dastnet` on a re-run where the network survived) reddens the
    # scheduled pipeline. -I keeps ZAP *findings* from doing that; nothing else here
    # is guarded.
    - |
      docker run --rm --network dastnet -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py -t http://app:3000 -I -r zap-report.html -J zap-report.json || true
  artifacts:
    when: always
    paths: [zap-report.html, zap-report.json]
    expire_in: 1 week

# Windows desktop installer. On a BRANCH this stays MANUAL: the build is slow
# and the artifact is large, so running it per-MR would dominate pipeline time
# and storage for no signal. On a TAG it is automatic and BLOCKING -- see
# desktop-package-tag below, not "MANUAL" -- a release must not silently skip
# its own installer.
#
# ★ The runners are Linux, so a Windows NSIS target needs wine — that is what
# this image provides. If this image is ever unreachable from this GitLab
# instance, DELETE this base and both desktop-package jobs rather than leaving
# them broken -- and remove publish-release IN THE SAME CHANGE. It
# has no needs:, so on its own it would go on running on every tag and publish
# a Release whose asset link names a job that no longer exists: a green
# pipeline over a download that 404s. Local packaging on Windows
# (npm run desktop:package) is the supported path either way.
#
# ★★ This REBUILDS the app with NEXT_STANDALONE=1 rather than consuming the
# build job's artifact. That is deliberate and is the one place the
# never-rebuild rule does not hold: `build` produces a NON-standalone .next/,
# so the artifact is the wrong SHAPE, not merely stale.
#
# ★★ allow_failure was indented under the `- when: manual` rule ONLY, mirroring
# dast-zap. A rules entry that omits it defaults to FALSE, so a second rule
# added here without its own allow_failure would make this job BLOCKING on any
# pipeline that matched it.
#
# ★★★ THAT SECOND RULE NOW EXISTS, AS ITS OWN JOB, AND ITS allow_failure IS
# DELIBERATELY ABSENT. desktop-package-tag is BLOCKING: a release that silently
# did not build is worse than a red pipeline. desktop-package ITSELF also
# gained a second rule (`if: $CI_COMMIT_TAG` -> `when: never`), and that one
# omits allow_failure too -- harmless, because `when: never` means the rule
# never produces a job at all, so there is nothing for allow_failure to apply
# to. The two concrete jobs also carry different artifact retention, which
# `artifacts:expire_in` cannot express per-rule -- that is why this is a base
# plus two jobs rather than one job with two rules.
.desktop-package:
  stage: e2e
  image: electronuserland/builder:wine
  needs: [install]
  script:
    - NEXT_STANDALONE=1 npm run build
    - npm run desktop:copy-static
    # ★ `ci` ALONE, with no `|| npm install` fallback: desktop/package-lock.json
    # is committed, and a fallback would resolve dependencies outside it --
    # silently, for an installer that gets published.
    - npm --prefix desktop ci
    - npm --prefix desktop run build
    - npm run desktop:package
    # ★★★ an empty glob match only makes the RUNNER log "No files to upload"
    # and leaves the job GREEN with no artifact. Fail loudly instead -- `ls`
    # exits non-zero when either glob matches nothing, so list both globs.
    - ls -l desktop/release/*-setup.exe desktop/release/*-setup.exe.blockmap
    # ★★ NO sharp IN THE PACKAGED APP, AT ANY DEPTH. desktop/electron-builder.yml
    # filters the TOP-LEVEL `sharp` and `@img/**` out of the standalone
    # node_modules -- why, and what it cost, is that file's comment on the second
    # extraResources entry. That filter cannot see a copy nested inside another
    # package's node_modules; this walk can, and FAILS the build on either kind
    # instead of quietly putting ~6 MiB back into an artifact whose headroom is
    # ~1.3 MB if the limit is GitLab's 100 MiB default. It reads win-unpacked/,
    # the tree electron-builder packs into the installer: on disk in this job,
    # just not uploaded.
    # ★ It sits on the BASE job, so it runs in the manual desktop-package AND the
    # blocking desktop-package-tag -- a tag pipeline goes red here, in e2e,
    # before publish-release (release stage) could publish the installer.
    # ★★★ The next/package.json test is what keeps the walk from being vacuous:
    # a search of a directory that is not there finds nothing and passes. It
    # also catches the traced dependencies not shipping at all, which the app
    # only reports at launch as `Cannot find module 'next'`. find's own failure
    # is checked separately, because an empty result from a failed walk would
    # otherwise read as a clean tree.
    - |
      nm=desktop/release/win-unpacked/resources/standalone/node_modules
      test -f "$nm/next/package.json" || { echo "sharp guard: $nm/next/package.json is missing -- the packaged tree moved, or its node_modules did not ship"; exit 1; }
      hits=$(find "$nm" \( -path '*/node_modules/sharp' -o -path '*/node_modules/@img/sharp-*' \) -prune -print) || { echo "sharp guard: find failed under $nm"; exit 1; }
      if [ -n "$hits" ]; then echo "sharp guard: sharp is in the packaged app -- see the sharp filter in desktop/electron-builder.yml:"; echo "$hits"; exit 1; fi
  artifacts:
    # ★★★ THE INSTALLER AND ITS BLOCKMAP, NEVER desktop/release/ WHOLE. This is
    # a defect fix, not an optimisation: measured 2026-09-10, the directory is
    # ~408 MiB of which win-unpacked/ is 314 MiB -- an expanded duplicate of the
    # installer's own contents. Narrowed it is ~93 MiB (97.5 MB).
    #
    # ★ The globs are self-protecting against a stale pre-artifactName build:
    # `*-setup.exe` does not match `aipm-cockpit Setup 0.301.0.exe`. CI starts
    # clean anyway; a local tree may hold both.
    #
    # ★★ 92.9 MiB (97.5 MB) sits against a documented 100 MB max_artifacts_size DEFAULT
    # that is admin-only and unreadable from here. A rejection arrives AFTER a
    # green build. See the spike finding under specs/_probes/.
    #
    # ★ `extends:` deep-merges HASHES ("You can use extends to merge hashes
    # but not arrays" -- GitLab docs), so a concrete job below that overrides
    # `artifacts:` to set only its own `expire_in` still inherits `paths` from
    # HERE and must NOT repeat it -- an earlier revision of this comment (and
    # of the plan) wrongly claimed extends "would otherwise drop paths".
    # Proven with the merge verifier (Task 4 Step 4), not by reasoning about
    # merge semantics.
    paths:
      - desktop/release/*-setup.exe
      - desktop/release/*-setup.exe.blockmap

desktop-package:
  extends: .desktop-package
  rules:
    # NOT on tags -- desktop-package-tag owns those, and two wine builds per
    # pipeline would double the slowest job in it.
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true
  artifacts:
    expire_in: 1 week

desktop-package-tag:
  extends: .desktop-package
  # ★★★ CRITICAL: also needs the tag guard, not just install. GitLab evaluates
  # `needs:` purely against the STATUS of what is listed (atomic_processing_
  # service.rb; docs: "Jobs start as soon as their dependencies finish without
  # waiting for pipeline stages to complete") -- with needs: [install] alone,
  # a drifted tag would still run this wine build to completion, and a
  # publish job wired by needs: to this job would still have created a
  # Release whose per-tag asset URL then 404s, because that URL resolves only
  # through a pipeline GitLab calls SUCCESSFUL. Task 7's publish-release
  # therefore carries no needs: and is gated by stage order instead. Listing
  # tag-version-check here makes this job WAIT for the guard; that a FAILED
  # guard then SKIPS it is expected needs: behaviour, but no GitLab doc
  # checked here states it and no tag pipeline has shown it.
  # ★ Deliberately NOT on the .desktop-package BASE above -- a branch pipeline
  # has no tag-version-check job, and a base needs: naming a job that does not
  # exist on that pipeline fails pipeline CREATION ("needs ... not added").
  needs: [install, tag-version-check]
  # ★★★ NO allow_failure, ON PURPOSE. See the comment above the base job.
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    # ★★★ never, because docs/desktop-rollout.md (linked from README) tells
    # people to download this. An expiring artifact is fine for a manual check and
    # unacceptable behind a published Release asset link -- the link would go
    # dead silently, weeks later, with nothing failing.
    expire_in: never

# Tag pipelines only: create the Release and point it at the installer.
#
# ★★★ NO `needs:`, AND THAT IS DELIBERATE -- do NOT "optimise" this back to
# needs: [desktop-package-tag]. GitLab evaluates `needs:` purely against the
# STATUS of the jobs listed, and dependency jobs start the moment those finish
# WITHOUT waiting for the rest of the pipeline's stages to complete (GitLab
# source: atomic_processing_service.rb; GitLab docs: "Jobs start as soon as
# their dependencies finish without waiting for pipeline stages to complete").
# desktop-package-tag itself needs only [install, tag-version-check] (Task 4)
# -- so needs: [desktop-package-tag] HERE would let this job fire the instant
# that ONE job succeeds, even if some OTHER blocking gate on the same tag
# pipeline (lint, typecheck, semgrep, unit tests, build, ...) later fails --
# e2e and prod-smoke do NOT run on tag pipelines at all (their own rules
# match merge_request_event / the default branch only), so neither is among
# those gates. The per-tag asset URL this job publishes only resolves
# through a pipeline GitLab calls SUCCESSFUL, so a needs:-based publish can
# create a Release whose download link 404s -- the exact bug this plan
# exists to close, just moved one job over. Omitting `needs:` puts this job
# on ordinary STAGE order: it sits in `release`, the LAST stage, and
# inherits the default `when: on_success`, which the GitLab docs define
# verbatim as: "on_success (default): Run the job only when no jobs in
# earlier stages fail." -- closing the dead-link case for EVERY blocking
# gate on the tag pipeline, not just the tag guard.
# ★★ THAT INCLUDES dast-zap's `when: manual` rule. A manual job's
# allow_failure DEFAULTS TO FALSE inside `rules:`, and a blocking manual job
# stops the pipeline at its own stage -- so publish-release also depends on
# dast-zap's manual rule keeping `allow_failure: true`. If that key were
# ever dropped, every tag pipeline would sit "blocked" in e2e and never
# reach `release`.
# ★ `dependencies: []` (not `needs:`) says the same "no needs:" thing to the
# artifact-download side: this job fetches NO artifacts from earlier jobs --
# not node_modules, not the installer -- since `release:publish` only needs
# the installer's download URL, never its bytes.
# ★ `cache: []` switches off the npm cache this job would otherwise inherit
# from `default:`. Nothing here needs node_modules: `release:publish` is
# plain `node scripts/publish-release.mjs`, which imports only node builtins
# and two local .mjs files that import nothing themselves -- so there is no
# `npm ci` either. `default:` carries no before_script today; if one is ever
# added, this job inherits it, and wants `before_script: []`.
# ★★ No allow_failure: a tag whose Release was never created looks published
# and is not -- docs/desktop-rollout.md (linked from README) sends people to a
# page with no download on it.
# ★ Image inherited from `default:` (node:24-bookworm-slim). No release-cli,
# no curl: the script uses node's global fetch.
publish-release:
  stage: release
  dependencies: []
  cache: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm run release:publish
