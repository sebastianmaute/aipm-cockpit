# Builds and publishes a desktop release when a v* tag is pushed.
# Design: docs/superpowers/specs/2026-09-24-releases-and-updates-design.md
# ★ Only `publish` can write and it installs no packages. The owner approves each release ONCE:
#   `sign` runs in the `release` environment, which pauses for the owner's approval (a
#   required-reviewer rule on it has been active since flip step 10a, when the repository went
#   public) and holds SIGNPATH_API_TOKEN; `publish` needs `sign` and names no environment, so it
#   asks for no second approval. `sign` runs on every release: with vars.SIGNPATH_ENABLED unset
#   it only passes the build's files through, so the approval always sits before publishing.
#   Beside that pause, what stands in front of `publish` -- and so in front of every installed
#   copy's auto-update while the installer is unsigned -- is the tag
#   ruleset (only the owner/admin role can create, move or delete a `refs/tags/v*`), the `guard`
#   job (the tag must equal APP_VERSION and name a commit reachable from `main`), and immutable
#   releases.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: The tag names APP_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-tag-version.mjs "$TAG"
      - name: The tagged commit is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: v
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      unpacked-artifact-id: ${{ steps.upload-unpacked.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      # Before the SBOM pre-pass: it reads the desktop set's licence texts and Electron from
      # desktop/node_modules.
      - run: npm --prefix desktop ci
      # SBOM_SOURCE_MAPS=1 makes the maps release:sbom reads (next.config.ts). They never ship:
      # release:strip-maps deletes the standalone copies before the pre-pass (so both passes read
      # exactly the shipped tree) and moves the build's own out of .next after it.
      - name: Standalone app build, with source maps for the SBOM
        env:
          NEXT_STANDALONE: "1"
          SBOM_SOURCE_MAPS: "1"
        run: npm run build
      - name: Delete the source maps in the standalone tree
        run: npm run release:strip-maps -- --delete .next/standalone
      - name: Licence notices and a provisional SBOM (release:sbom pre-pass)
        run: npm run release:sbom -- --build .next --standalone .next/standalone --desktop desktop --out .next/sbom
      - name: Move the build's source maps out of .next
        run: npm run release:strip-maps -- --build .next --keep sbom-maps
      - run: npm run desktop:copy-static -- --notices .next/sbom/THIRD-PARTY-NOTICES.txt
      - run: npm --prefix desktop run build
      - run: npm run desktop:package
      # The kept maps stand in for .next; --asar fails unless the packed app.asar holds exactly the
      # desktop set the pre-pass listed.
      - name: The final SBOM, with the packed app.asar checked against the desktop set
        run: npm run release:sbom -- --build sbom-maps --standalone .next/standalone --desktop desktop --out desktop/release --asar desktop/release/win-unpacked/resources/app.asar
      - name: The package ships the notices and no source map
        shell: bash
        run: |
          app=desktop/release/win-unpacked
          test -f "$app/resources/standalone/server.js" || { echo "map guard: $app/resources/standalone/server.js is missing -- the packaged tree moved"; exit 1; }
          maps=$(find "$app/resources" -name '*.map' -print) || { echo "map guard: find failed under $app/resources"; exit 1; }
          if [ -n "$maps" ]; then echo "map guard: source maps in the packaged app -- see release:strip-maps and the !**/*.map filters in desktop/electron-builder.yml:"; echo "$maps"; exit 1; fi
          # find sees app.asar as one file; the desktop shell's production dependencies carry maps of
          # their own, so list the archive. grep -c exits 1 on zero matches, so each count goes into a
          # variable and is tested; the archive's own package.json is the positive control.
          asar=desktop/node_modules/.bin/asar
          listing=$("$asar" list "$app/resources/app.asar" | tr -d '\r') || { echo "map guard: asar list failed on $app/resources/app.asar"; exit 1; }
          root=$(grep -cE '^[/\\]package\.json$' <<<"$listing") || true
          [ "$root" = "1" ] || { echo "map guard: app.asar's listing has no /package.json -- the archive or asar list's output moved"; exit 1; }
          asarmaps=$(grep -cE '\.map$' <<<"$listing") || true
          [ "$asarmaps" = "0" ] || { echo "map guard: $asarmaps source map(s) inside app.asar -- see files: in desktop/electron-builder.yml:"; grep -E '\.map$' <<<"$listing"; exit 1; }
          # The final pass's notices equal the shipped ones only if both passes saw the same set.
          cmp desktop/release/THIRD-PARTY-NOTICES.txt "$app/THIRD-PARTY-NOTICES.txt" || { echo "notices guard: the install folder's THIRD-PARTY-NOTICES.txt is missing or differs from the final pass's -- see extraFiles in desktop/electron-builder.yml"; exit 1; }
          cmp desktop/release/THIRD-PARTY-NOTICES.txt "$app/resources/standalone/public/third-party-notices.txt" || { echo "notices guard: the Help panel's third-party-notices.txt is missing or differs from the final pass's -- see desktop:copy-static --notices"; exit 1; }
      - name: The package holds the four files and no sharp
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          ls -l "desktop/release/aipm-cockpit-$VERSION-setup.exe" "desktop/release/aipm-cockpit-$VERSION-setup.exe.blockmap" desktop/release/latest.yml "desktop/release/aipm-cockpit-$VERSION-sbom.cdx.json"
          nm=desktop/release/win-unpacked/resources/standalone/node_modules
          test -f "$nm/next/package.json" || { echo "sharp guard: $nm/next/package.json is missing -- the packaged tree moved, or its node_modules did not ship"; exit 1; }
          hits=$(find "$nm" \( -path '*/node_modules/sharp' -o -path '*/node_modules/@img/sharp-*' \) -prune -print) || { echo "sharp guard: find failed under $nm"; exit 1; }
          if [ -n "$hits" ]; then echo "sharp guard: sharp is in the packaged app -- see the sharp filter in desktop/electron-builder.yml:"; echo "$hits"; exit 1; fi
      - name: The packaged app actually contains electron-updater
        shell: bash
        run: |
          asar=desktop/node_modules/.bin/asar
          app=desktop/release/win-unpacked/resources/app.asar
          test -f "$app" || { echo "electron-updater guard: $app is missing -- the packaged tree moved"; exit 1; }
          listing=$("$asar" list "$app") || { echo "electron-updater guard: asar list failed on $app"; exit 1; }
          # asar list reports path.join()-native separators -- on this windows-latest runner that is
          # "\", verified locally where the same call prints "\node_modules\electron-updater\out\
          # main.js" -- so the bracket class matches either separator rather than assuming one.
          grep -qE 'node_modules[/\\]electron-updater[/\\]out[/\\]main\.js' <<<"$listing" || { echo "electron-updater guard: node_modules/electron-updater/out/main.js is not in the packaged app -- check desktop/package.json dependencies"; exit 1; }
          grep -qE 'node_modules[/\\]builder-util-runtime([/\\]|$)' <<<"$listing" || { echo "electron-updater guard: node_modules/builder-util-runtime (electron-updater's own runtime dependency) is not in the packaged app"; exit 1; }
      - name: The packaged exe carries the Electron fuses
        shell: bash
        run: |
          # §561. Fuses exist only in a packaged binary, so this is the one place they can be read.
          # electron-fuses ships with @electron/fuses, which electron-builder installs; its read prints
          # one "  <Fuse> is Enabled|Disabled" line per fuse (measured on a stock and a fused electron.exe).
          fuses=desktop/node_modules/.bin/electron-fuses
          exe="desktop/release/win-unpacked/AI PM Cockpit.exe"
          test -f "$exe" || { echo "fuse guard: $exe is missing -- the packaged tree moved"; exit 1; }
          out=$("$fuses" read --app "$exe" | sed 's/\x1b\[[0-9;]*m//g') || { echo "fuse guard: electron-fuses read failed on $exe"; exit 1; }
          echo "$out"
          for want in "RunAsNode is Disabled" "EnableNodeCliInspectArguments is Disabled" "EnableNodeOptionsEnvironmentVariable is Disabled" "OnlyLoadAppFromAsar is Enabled"; do
            grep -qxF "  $want" <<<"$out" || { echo "fuse guard: expected \"$want\" -- see electronFuses in desktop/electron-builder.yml"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            desktop/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe
            desktop/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe.blockmap
            desktop/release/latest.yml
            desktop/release/aipm-cockpit-${{ needs.guard.outputs.version }}-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
      # Only when signing is on: the packaged app the sign job repackages (and, with
      # SIGNPATH_SIGN_APP_EXE, submits to SignPath by this artifact's id first).
      # ★ include-hidden-files: upload-artifact skips dot-folders by default, which would drop
      # resources/standalone/.next and ship an app whose server cannot start. The sign job checks
      # for it before repackaging.
      - name: Upload the packaged app for the sign job
        id: upload-unpacked
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpacked-app
          path: desktop/release/win-unpacked
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The one approval, and the signing switch. Every step that signs carries
  # `if: ${{ vars.SIGNPATH_ENABLED == 'true' }}`; with the switch off the job downloads the build's
  # four files, runs the one-way guard and release:verify on them, and uploads them unchanged.
  # With it on, the setup is rebuilt with `--prepackaged` around the build's packaged app (or its
  # SignPath-signed copy), the new setup is signed by SignPath, and latest.yml and the blockmap are
  # rewritten over the signed bytes. `--prepackaged` writes NO resources/app-update.yml (that file
  # is written only by electron-builder's after-pack hook, which a prepackaged run skips), so the
  # file in the tree is the one the `build` job packed, which names no publisher. The step before
  # the repackage adds `publisherName: [SignPath Foundation]` to it (scripts/release-update-feed.mjs),
  # so the signed build's updater refuses any update it cannot verify
  # (desktop/src/update-signature.ts); the check after the repackage refuses a tree without it.
  # What SignPath signs here: the app's own PE files (the packaged-app artifact, when
  # SIGNPATH_SIGN_APP_EXE is 'true') and the setup exe. The uninstaller is NOT signed yet: it is
  # reachable through a signing hook during the repackage (electron-builder writes it to its own
  # file and signs it before building the setup), but that is deferred pending a decision on
  # whether such a hook meets SignPath's trusted-build rules -- see docs/open-followups.md.
  # ★ A signed installer whose updater accepts any update must not ship: the step after the
  # repackage fails the release unless the packed app's update feed requires the signature.
  # ★ And the final signed setup must pass the installed app's OWN verifier, fed that feed's
  # publisher names (scripts/release-verify-signature.mjs): a certificate whose CN is not exactly
  # the name would ship a release that refuses every later update.
  sign:
    needs: [guard, build]
    runs-on: windows-latest
    timeout-minutes: 150
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      # No install scripts in the job that holds the SignPath token (as ci.yml installs).
      - name: Install the desktop packaging tools
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        run: npm --prefix desktop ci --ignore-scripts
      - name: Download the packaged app
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unpacked-app
          path: ${{ runner.temp }}/unpacked
      # The SignPath artifact configuration `app` names the PE files inside the zipped packaged app.
      - name: Sign the app's own executables
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && vars.SIGNPATH_SIGN_APP_EXE == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ needs.build.outputs.unpacked-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          # The signed packaged app is several hundred MB; the action's 300 s default is too short.
          download-signed-artifact-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/unpacked-signed
      # The installed app's own verifier (desktop/src/update-signature.ts) judges the signature: Valid,
      # and the signer's CN exactly SignPath Foundation. The feed is not written yet, so the name is given.
      - name: The app's executable is signed by SignPath Foundation
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && vars.SIGNPATH_SIGN_APP_EXE == 'true' }}
        shell: bash
        env:
          FILE: ${{ runner.temp }}/unpacked-signed/AI PM Cockpit.exe
        run: node scripts/release-verify-signature.mjs --publisher "SignPath Foundation" "$FILE"
      # The packaged app's server needs both files; a tree that lost its hidden .next folder on the
      # way here (an artifact upload without include-hidden-files) would install an app that cannot
      # start, so the job stops before repackaging it.
      - name: The app tree holds the standalone server and its .next build
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: bash
        env:
          APP_DIR: ${{ vars.SIGNPATH_SIGN_APP_EXE == 'true' && format('{0}/unpacked-signed', runner.temp) || format('{0}/unpacked', runner.temp) }}
        run: |
          for f in "$APP_DIR/resources/standalone/server.js" "$APP_DIR/resources/standalone/.next/BUILD_ID"; do
            [ -f "$f" ] || { echo "app-tree check: $f is missing -- the packaged app would not start"; exit 1; }
          done
          echo "app-tree check: server.js and .next/BUILD_ID present in $APP_DIR"
      # The tree's resources/app-update.yml is the `build` job's, which names no publisher, and the
      # repackage below writes none. This adds `publisherName: [SignPath Foundation]` to it, keeping
      # every other key, so the signed build's updater refuses any update it cannot verify; it
      # fails the step on a missing or unreadable feed, or on any other publisherName already there.
      # app-update.yml is not a PE file, so a signed app tree's signatures are untouched.
      - name: Require the SignPath Foundation signature in the app's update feed
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: bash
        env:
          APP_DIR: ${{ vars.SIGNPATH_SIGN_APP_EXE == 'true' && format('{0}/unpacked-signed', runner.temp) || format('{0}/unpacked', runner.temp) }}
        run: node scripts/release-update-feed.mjs "$APP_DIR"
      # --prepackaged skips packing (no fuses, resource edits, asar or app-update.yml are redone)
      # and runs the NSIS target only, around whichever app tree APP_DIR names.
      - name: Repackage the setup around the app tree
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: bash
        env:
          APP_DIR: ${{ vars.SIGNPATH_SIGN_APP_EXE == 'true' && format('{0}/unpacked-signed', runner.temp) || format('{0}/unpacked', runner.temp) }}
        run: npm run desktop:package -- --prepackaged "$APP_DIR"
      # A signed installer whose updater does not require the signature would install anything
      # served as an update. The publisherName comes from the step before the repackage, which the
      # repackage leaves alone; should that ever not hold, the release fails here. The match is the
      # first list item directly under the key, the shape scripts/release-update-feed.mjs writes,
      # so "SignPath Foundation" elsewhere in the file does not count.
      - name: The repackaged app's updater requires the SignPath Foundation signature
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          APP_DIR: ${{ vars.SIGNPATH_SIGN_APP_EXE == 'true' && format('{0}/unpacked-signed', runner.temp) || format('{0}/unpacked', runner.temp) }}
        run: |
          $feed = Join-Path $env:APP_DIR 'resources/app-update.yml'
          if (-not (Test-Path -LiteralPath $feed)) { Write-Output "update-feed check: $feed is missing"; exit 1 }
          $text = Get-Content -LiteralPath $feed -Raw
          if ($text -notmatch '(?m)^publisherName:[ \t]*\r?\n[ \t]+-[ \t]*[''"]?SignPath Foundation[''"]?[ \t]*\r?$') { Write-Output "update-feed check: $feed has no publisherName naming SignPath Foundation -- the signed build's updater would not verify updates"; exit 1 }
      - name: Upload the unsigned installer
        id: upload-unsigned
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-setup
          path: desktop/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 1
      # The SignPath artifact configuration `installer` names the setup exe inside the zip.
      - name: Sign the installer
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          # The action's 300 s default HTTP timeout for fetching the signed zip; the setup is large too.
          download-signed-artifact-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signed-setup
      # Signing changed the installer's bytes, so electron-builder's latest.yml and blockmap no
      # longer describe it; both are rewritten over the signed file (release:verify checks them).
      - name: Take the signed installer and rewrite the update feed
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          SIGNED: ${{ runner.temp }}/signed-setup
          FINAL: ${{ runner.temp }}/release
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $exe = "aipm-cockpit-$env:VERSION-setup.exe"
          if (-not (Test-Path -LiteralPath (Join-Path $env:SIGNED $exe))) { Write-Output "SignPath returned no $exe"; exit 1 }
          Copy-Item -LiteralPath (Join-Path $env:SIGNED $exe) -Destination (Join-Path $env:FINAL $exe) -Force
          node scripts/release-latest-yml.mjs "$env:FINAL" "$env:VERSION"
      # The final signed setup, judged by the installed app's own verifier (verifyUpdateSignature in
      # desktop/src/update-signature.ts) against the publisher names in the repackaged app's
      # resources/app-update.yml -- the very check every installed copy of this release will run on
      # the next update. Were the certificate's CN anything but exactly the feed's name, this release
      # would install fine and then refuse every later update; the release fails here instead.
      - name: The installer passes the app's own update signature check
        id: installer-signature
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: bash
        env:
          APP_DIR: ${{ vars.SIGNPATH_SIGN_APP_EXE == 'true' && format('{0}/unpacked-signed', runner.temp) || format('{0}/unpacked', runner.temp) }}
          FILE: ${{ runner.temp }}/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe
        run: node scripts/release-verify-signature.mjs --feed "$APP_DIR/resources/app-update.yml" "$FILE"
      # What the release notes say (publish's RELEASE_SIGNED): true only when the check above ran
      # and passed in this run, false when it was skipped (signing off). A failed check fails the
      # job, so publish never runs.
      - name: Record whether the installer is signed
        id: signed
        shell: bash
        env:
          CHECKED: ${{ steps.installer-signature.outcome == 'success' }}
        run: echo "signed=$CHECKED" >> "$GITHUB_OUTPUT"
      # On every release, signing on or off: exit 1 (unsigned after a signed release) and exit 2
      # (cannot decide) both fail the step.
      - name: No unsigned release after a signed one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FINAL: ${{ runner.temp }}/release
        run: node scripts/release-signing-guard.mjs "$TAG" "$FINAL"
      - name: Verify the files
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          FINAL: ${{ runner.temp }}/release
        run: npm run release:verify -- "$FINAL" "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-final
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  # No environment here: the owner's approval was given at `sign`, which this job needs.
  publish:
    needs: [guard, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final
          path: ${{ runner.temp }}/release
      - name: Verify the files
        env:
          TAG: ${{ github.ref_name }}
          DIR: ${{ runner.temp }}/release
        run: npm run release:verify -- "$DIR" "$TAG"
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Attest the SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ runner.temp }}/release/aipm-cockpit-${{ needs.guard.outputs.version }}-sbom.cdx.json
          subject-path: ${{ runner.temp }}/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe
      - name: Attestation skipped (private repository)
        if: ${{ github.event.repository.private }}
        run: echo "Provenance and SBOM attestations skipped - attestations on a private repository need GitHub Enterprise."
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # The sign job's signature check decides the signed or unsigned notice, not the switch.
          RELEASE_SIGNED: ${{ needs.sign.outputs.signed }}
          TAG: ${{ github.ref_name }}
          DIR: ${{ runner.temp }}/release
        run: npm run release:publish -- "$DIR" "$TAG"
