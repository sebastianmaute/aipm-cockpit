# Builds and publishes a desktop release when a v* tag is pushed.
# Design: docs/superpowers/specs/2026-09-24-releases-and-updates-design.md
# ★ Only `publish` can write and it installs no packages. It runs in the `release` environment,
#   which pauses for the owner's approval: a required-reviewer rule on it has been active since
#   flip step 10a, when the repository went public. Beside that pause, what stands in front of
#   `publish` -- and so in front of every installed copy's auto-update, since the installer is
#   unsigned -- is the tag
#   ruleset (only the owner/admin role can create, move or delete a `refs/tags/v*`), the `guard`
#   job (the tag must equal APP_VERSION and name a commit reachable from `main`), and immutable
#   releases.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: The tag names APP_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-tag-version.mjs "$TAG"
      - name: The tagged commit is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: v
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      # Before the SBOM pre-pass: it reads the desktop set's licence texts and Electron from
      # desktop/node_modules.
      - run: npm --prefix desktop ci
      # SBOM_SOURCE_MAPS=1 makes the maps release:sbom reads (next.config.ts). They never ship:
      # release:strip-maps deletes the standalone copies before the pre-pass (so both passes read
      # exactly the shipped tree) and moves the build's own out of .next after it.
      - name: Standalone app build, with source maps for the SBOM
        env:
          NEXT_STANDALONE: "1"
          SBOM_SOURCE_MAPS: "1"
        run: npm run build
      - name: Delete the source maps in the standalone tree
        run: npm run release:strip-maps -- --delete .next/standalone
      - name: Licence notices and a provisional SBOM (release:sbom pre-pass)
        run: npm run release:sbom -- --build .next --standalone .next/standalone --desktop desktop --out .next/sbom
      - name: Move the build's source maps out of .next
        run: npm run release:strip-maps -- --build .next --keep sbom-maps
      - run: npm run desktop:copy-static -- --notices .next/sbom/THIRD-PARTY-NOTICES.txt
      - run: npm --prefix desktop run build
      - run: npm run desktop:package
      # The kept maps stand in for .next; --asar fails unless the packed app.asar holds exactly the
      # desktop set the pre-pass listed.
      - name: The final SBOM, with the packed app.asar checked against the desktop set
        run: npm run release:sbom -- --build sbom-maps --standalone .next/standalone --desktop desktop --out desktop/release --asar desktop/release/win-unpacked/resources/app.asar
      - name: The package ships the notices and no source map
        shell: bash
        run: |
          app=desktop/release/win-unpacked
          test -f "$app/resources/standalone/server.js" || { echo "map guard: $app/resources/standalone/server.js is missing -- the packaged tree moved"; exit 1; }
          maps=$(find "$app/resources" -name '*.map' -print) || { echo "map guard: find failed under $app/resources"; exit 1; }
          if [ -n "$maps" ]; then echo "map guard: source maps in the packaged app -- see release:strip-maps and the !**/*.map filters in desktop/electron-builder.yml:"; echo "$maps"; exit 1; fi
          # find sees app.asar as one file; the desktop shell's production dependencies carry maps of
          # their own, so list the archive. grep -c exits 1 on zero matches, so each count goes into a
          # variable and is tested; the archive's own package.json is the positive control.
          asar=desktop/node_modules/.bin/asar
          listing=$("$asar" list "$app/resources/app.asar" | tr -d '\r') || { echo "map guard: asar list failed on $app/resources/app.asar"; exit 1; }
          root=$(grep -cE '^[/\\]package\.json$' <<<"$listing") || true
          [ "$root" = "1" ] || { echo "map guard: app.asar's listing has no /package.json -- the archive or asar list's output moved"; exit 1; }
          asarmaps=$(grep -cE '\.map$' <<<"$listing") || true
          [ "$asarmaps" = "0" ] || { echo "map guard: $asarmaps source map(s) inside app.asar -- see files: in desktop/electron-builder.yml:"; grep -E '\.map$' <<<"$listing"; exit 1; }
          # The final pass's notices equal the shipped ones only if both passes saw the same set.
          cmp desktop/release/THIRD-PARTY-NOTICES.txt "$app/THIRD-PARTY-NOTICES.txt" || { echo "notices guard: the install folder's THIRD-PARTY-NOTICES.txt is missing or differs from the final pass's -- see extraFiles in desktop/electron-builder.yml"; exit 1; }
          cmp desktop/release/THIRD-PARTY-NOTICES.txt "$app/resources/standalone/public/third-party-notices.txt" || { echo "notices guard: the Help panel's third-party-notices.txt is missing or differs from the final pass's -- see desktop:copy-static --notices"; exit 1; }
      - name: The package holds the four files and no sharp
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          ls -l "desktop/release/aipm-cockpit-$VERSION-setup.exe" "desktop/release/aipm-cockpit-$VERSION-setup.exe.blockmap" desktop/release/latest.yml "desktop/release/aipm-cockpit-$VERSION-sbom.cdx.json"
          nm=desktop/release/win-unpacked/resources/standalone/node_modules
          test -f "$nm/next/package.json" || { echo "sharp guard: $nm/next/package.json is missing -- the packaged tree moved, or its node_modules did not ship"; exit 1; }
          hits=$(find "$nm" \( -path '*/node_modules/sharp' -o -path '*/node_modules/@img/sharp-*' \) -prune -print) || { echo "sharp guard: find failed under $nm"; exit 1; }
          if [ -n "$hits" ]; then echo "sharp guard: sharp is in the packaged app -- see the sharp filter in desktop/electron-builder.yml:"; echo "$hits"; exit 1; fi
      - name: The packaged app actually contains electron-updater
        shell: bash
        run: |
          asar=desktop/node_modules/.bin/asar
          app=desktop/release/win-unpacked/resources/app.asar
          test -f "$app" || { echo "electron-updater guard: $app is missing -- the packaged tree moved"; exit 1; }
          listing=$("$asar" list "$app") || { echo "electron-updater guard: asar list failed on $app"; exit 1; }
          # asar list reports path.join()-native separators -- on this windows-latest runner that is
          # "\", verified locally where the same call prints "\node_modules\electron-updater\out\
          # main.js" -- so the bracket class matches either separator rather than assuming one.
          grep -qE 'node_modules[/\\]electron-updater[/\\]out[/\\]main\.js' <<<"$listing" || { echo "electron-updater guard: node_modules/electron-updater/out/main.js is not in the packaged app -- check desktop/package.json dependencies"; exit 1; }
          grep -qE 'node_modules[/\\]builder-util-runtime([/\\]|$)' <<<"$listing" || { echo "electron-updater guard: node_modules/builder-util-runtime (electron-updater's own runtime dependency) is not in the packaged app"; exit 1; }
      - name: The packaged exe carries the Electron fuses
        shell: bash
        run: |
          # §561. Fuses exist only in a packaged binary, so this is the one place they can be read.
          # electron-fuses ships with @electron/fuses, which electron-builder installs; its read prints
          # one "  <Fuse> is Enabled|Disabled" line per fuse (measured on a stock and a fused electron.exe).
          fuses=desktop/node_modules/.bin/electron-fuses
          exe="desktop/release/win-unpacked/AI PM Cockpit.exe"
          test -f "$exe" || { echo "fuse guard: $exe is missing -- the packaged tree moved"; exit 1; }
          out=$("$fuses" read --app "$exe" | sed 's/\x1b\[[0-9;]*m//g') || { echo "fuse guard: electron-fuses read failed on $exe"; exit 1; }
          echo "$out"
          for want in "RunAsNode is Disabled" "EnableNodeCliInspectArguments is Disabled" "EnableNodeOptionsEnvironmentVariable is Disabled" "OnlyLoadAppFromAsar is Enabled"; do
            grep -qxF "  $want" <<<"$out" || { echo "fuse guard: expected \"$want\" -- see electronFuses in desktop/electron-builder.yml"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            desktop/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe
            desktop/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe.blockmap
            desktop/release/latest.yml
            desktop/release/aipm-cockpit-${{ needs.guard.outputs.version }}-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Verify the files
        env:
          TAG: ${{ github.ref_name }}
          DIR: ${{ runner.temp }}/release
        run: npm run release:verify -- "$DIR" "$TAG"
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Attest the SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ runner.temp }}/release/aipm-cockpit-${{ needs.guard.outputs.version }}-sbom.cdx.json
          subject-path: ${{ runner.temp }}/release/aipm-cockpit-${{ needs.guard.outputs.version }}-setup.exe
      - name: Attestation skipped (private repository)
        if: ${{ github.event.repository.private }}
        run: echo "Provenance and SBOM attestations skipped - attestations on a private repository need GitHub Enterprise."
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIR: ${{ runner.temp }}/release
        run: npm run release:publish -- "$DIR" "$TAG"
