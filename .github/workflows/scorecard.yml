# OpenSSF Scorecard: a weekly score of supply-chain practices (branch protection, pinned actions,
# token permissions, signed releases, ...). Results go to Code Scanning and to the public
# scorecard.dev API. Not a required check. scorecard-action refuses to publish unless this workflow
# stays minimal: read-only at the top, no env or containers, and only checkout, scorecard,
# upload-artifact and upload-sarif steps. Keep it that way.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
