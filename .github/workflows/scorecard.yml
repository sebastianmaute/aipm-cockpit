# OpenSSF Scorecard: a weekly score of supply-chain practices (branch protection, pinned actions,
# token permissions, signed releases, ...). Results go to Code Scanning and to the public
# scorecard.dev API. Not a required check. scorecard-action refuses to publish unless this workflow
# stays minimal: read-only at the top, no env or containers, and only checkout, scorecard,
# upload-artifact and upload-sarif steps. Keep it that way.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
