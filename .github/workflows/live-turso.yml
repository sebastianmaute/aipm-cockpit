# The live-Turso e2e specs, against a dedicated throwaway database (§215). NOT a required check:
# docs/AGENTS/ci.md says why and how to read it. Which specs run is playwright.config.ts's
# LIVE_TURSO_DESTRUCTIVE and LIVE_TURSO_APP; which database they may touch is e2e/live-turso-env.ts.
#
# ★★★ THE SECRETS. Two repository secrets, TURSO_THROWAWAY_DATABASE_URL and
# TURSO_THROWAWAY_AUTH_TOKEN, for a Turso database kept for this workflow alone (the specs drop its
# tables). The token MUST be scoped to that one database (`turso db tokens create <db>`), never a
# group or organisation token: what a leak, or a branch, can reach is exactly what the token
# reaches. ★ Accepted risk, stated: anyone who can push a branch to this repository can change the
# specs, playwright.config.ts or package.json that this workflow runs, and so read the secrets.
# That is inherent to running secrets on pull_request; it is acceptable while only the owner has
# write access. With collaborators, gate the live job on an environment with required reviewers.
# pull_request_target is never used: it would hand the secrets to a fork's code.
#
# ★★★ THE SECRETS NEVER REACH A run: LINE, AND ONLY THE STEPS THAT NEED THEM GET THEM. They enter
# through a step's env: only (a job-level env: would hand them to npm ci, which runs every
# dependency's install scripts). The `check` job reads them to answer one question, are both set;
# with either missing (a fork's pull request, Dependabot, or before the owner sets them) the
# `live-turso` job is skipped.
#
# ★★★ ONE DATABASE, ONE RUN AT A TIME, AND RUNS CAN BE DROPPED. The live job's concurrency group is
# a fixed name, so every run shares one slot; cancel-in-progress is false, so a running job is
# never cancelled. GitHub keeps ONE pending run per group: a second run waits, and a third
# REPLACES the waiting second, which ends "cancelled" and is not re-queued. Re-run it by hand
# (Re-run jobs, or workflow_dispatch). docs/AGENTS/ci.md covers whether a skipped run can take the
# slot (expected not, not yet observed).
#
# ★★ The two secrets go into BOTH pairs for the app step: the specs read TURSO_THROWAWAY_*, and the
# dev server the app runs on reads NEXT_PUBLIC_TURSO_*, so the app's database IS the throwaway one.
# playwright.config.ts turns trace and video off whenever either pair carries a token, so the
# uploaded reports hold no Authorization header.
name: live-turso

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.pair.outputs.present }}
    steps:
      - name: Are both throwaway database values set?
        id: pair
        env:
          URL: ${{ secrets.TURSO_THROWAWAY_DATABASE_URL }}
          TOKEN: ${{ secrets.TURSO_THROWAWAY_AUTH_TOKEN }}
        run: |
          if [ -n "$URL" ] && [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::live-turso skipped: TURSO_THROWAWAY_DATABASE_URL and TURSO_THROWAWAY_AUTH_TOKEN are not both set for this run (a fork, Dependabot, or not configured yet)."
          fi

  live-turso:
    needs: check
    if: needs.check.outputs.present == 'true'
    concurrency:
      group: live-turso-throwaway-database
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The two test steps' own timeouts plus at least 15 minutes of setup (the Playwright image,
    # npm ci, Chromium); ci-workflow.test.mjs checks the sum.
    timeout-minutes: 50
    # Keep this tag equal to @playwright/test in package-lock.json (ci-workflow.test.mjs checks).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        id: install
        run: npx playwright install chromium
      # Each test step:
      # - has its own timeout, below the job's, so a hung step FAILS rather than the job being
      #   cancelled, and the next step and the upload run as after any failure;
      # - sets E2E_GLOBAL_TIMEOUT_MS, two minutes under that (playwright.config.ts's globalTimeout),
      #   so Playwright stops itself and still writes its HTML report, whatever the number of tests;
      # - then runs scripts/check-live-run.mjs on the JSON report (E2E_JSON_REPORT), which fails
      #   the step if any test SKIPPED or none ran: every live spec skips when a setting it needs is
      #   missing, and a run that skipped everything would otherwise be green and prove nothing.
      # First and alone: the specs that DROP tables. The npm script sets E2E_LIVE_DESTRUCTIVE and
      # PLAYWRIGHT_NO_WEBSERVER itself.
      - name: Live specs that drop tables
        id: drop
        timeout-minutes: 12
        env:
          TURSO_THROWAWAY_DATABASE_URL: ${{ secrets.TURSO_THROWAWAY_DATABASE_URL }}
          TURSO_THROWAWAY_AUTH_TOKEN: ${{ secrets.TURSO_THROWAWAY_AUTH_TOKEN }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/drop-tables
          E2E_JSON_REPORT: playwright-report/drop-tables.json
          E2E_GLOBAL_TIMEOUT_MS: "600000"
        run: npm run e2e:live-destructive && node scripts/check-live-run.mjs
      # Then the specs that drive the app, on a dev server started with the throwaway database as
      # the app's own. Runs even when the step above failed, so one failure does not hide the other
      # suite, but not when setup failed (install's outcome is then failure or skipped), which would
      # only add a second, misleading failure.
      - name: Live specs that drive the app
        id: app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        env:
          TURSO_THROWAWAY_DATABASE_URL: ${{ secrets.TURSO_THROWAWAY_DATABASE_URL }}
          TURSO_THROWAWAY_AUTH_TOKEN: ${{ secrets.TURSO_THROWAWAY_AUTH_TOKEN }}
          NEXT_PUBLIC_TURSO_DATABASE_URL: ${{ secrets.TURSO_THROWAWAY_DATABASE_URL }}
          NEXT_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.TURSO_THROWAWAY_AUTH_TOKEN }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/drive-app
          E2E_JSON_REPORT: playwright-report/drive-app.json
          E2E_GLOBAL_TIMEOUT_MS: "1080000"
        run: npm run e2e:live-app && node scripts/check-live-run.mjs
      # On failure, and on cancellation too. A step that hits its own timeout fails, so the other
      # step's finished report is kept. A JOB that hits timeout-minutes ends cancelled; its upload is
      # best-effort, because Playwright writes its HTML report only when its run ends, so a step
      # killed mid-run may leave none. Trace and video are off, so no report holds a token.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() || cancelled() }}
        with:
          name: live-turso-report
          path: playwright-report/
          retention-days: 7
