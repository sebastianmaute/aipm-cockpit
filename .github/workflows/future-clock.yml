# Weekly, non-blocking (§149): the whole unit suite with Date moved 400 days ahead
# (src/test/clock-offset.ts). A red test here passes today only because a hardcoded date is still in
# the future, and will break on its own. Its own workflow, not a scheduled.yml job, so a manual run
# costs only this suite's minutes. Each failing test is annotated on the run by the github-actions
# reporter, which is where the findings are recorded.
# Reproduce one: VITEST_CLOCK_OFFSET_DAYS=400 npx vitest run <file>
name: future-clock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-future-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # desktop/**/*.test.ts (part of test:run's include) imports electron/electron-updater.
      - run: npm --prefix desktop ci --ignore-scripts
      - run: npm run test:run -- --reporter=default --reporter=github-actions
        env:
          VITEST_CLOCK_OFFSET_DAYS: "400"
