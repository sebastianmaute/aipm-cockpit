# Weekly updates. Minor and patch versions arrive as one grouped PR per npm directory; majors and
# every exactly pinned framework package (CONTRIBUTING "Dependencies") arrive one PR each, for a
# human decision. The vitest family is the exception: it always arrives as one PR of its own.
# scripts/dependabot-config.test.mjs derives the pinned set from each package.json.
# Container digests (semgrep, actionlint) are not covered; re-resolve them by hand.
# Every entry has a cooldown: it holds version updates back until a release has been public 7 days
# (14 for a major), and does not delay security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # vitest and its plugins must move together: each @vitest/* package peers on the exact
      # vitest version, so a vitest major alone cannot install (Dependabot PR #415, 2026-09-25).
      vitest:
        patterns: [vitest, "@vitest/*"]
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [eslint-config-next, next, react, react-dom]
    ignore:
      # TypeScript 7 is the native compiler, and its npm package drops the compiler API that
      # src/test/strip-comments.ts, scripts/src-symbols-lib.mjs and two tests parse with;
      # next build failed on it too (PR #413). Lift this when both support 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [electron, electron-builder, electron-updater]
