# Weekly updates. Minor and patch versions arrive as one grouped PR per npm directory; majors and
# every exactly pinned framework package (CONTRIBUTING "Dependencies") arrive one PR each, for a
# human decision. scripts/dependabot-config.test.mjs derives the pinned set from each package.json.
# Container digests (semgrep, actionlint) are not covered; re-resolve them by hand.
# HELD while the repository is private: open-pull-requests-limit: 0 stops version-update PRs, which
# spend Actions minutes. Security-fix PRs are not affected by this limit and stay on. Flip step 10a
# deletes the three limit lines once the repository is public.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [eslint-config-next, next, react, react-dom]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [electron, electron-builder, electron-updater]
