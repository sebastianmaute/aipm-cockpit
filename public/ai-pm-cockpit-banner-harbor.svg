<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI PM Cockpit">
  <title>AI PM Cockpit — Harbor theme</title>

  <!-- background (Harbor light: surface / background) -->
  <rect x="0" y="0" width="1200" height="280" fill="#f6f8fa" />
  <rect x="0" y="0" width="1200" height="280" fill="#ffffff" opacity="0.5" />

  <!-- HUD grid lines (line color) -->
  <g stroke="#dbe2ea" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="900" y1="0" x2="900" y2="280" />
  </g>

  <!-- right-side abstract cockpit arcs (green / purple accents) -->
  <g fill="none" stroke="#2bc4b6" stroke-width="2">
    <circle cx="1030" cy="140" r="150" opacity="0.12" />
    <circle cx="1030" cy="140" r="105" opacity="0.20" />
    <circle cx="1030" cy="140" r="60" opacity="0.30" />
  </g>
  <g fill="none" stroke="#5f57a8" stroke-width="1.5" opacity="0.30">
    <path d="M 950 60 A 120 120 0 0 1 1110 100" />
    <path d="M 960 220 A 120 120 0 0 0 1120 175" />
  </g>

  <!-- cockpit gauge icon (dark-blue ring, pink needle) -->
  <g transform="translate(150,140)">
    <circle r="72" fill="none" stroke="#153a5c" stroke-width="5" />
    <circle r="72" fill="none" stroke="#2bc4b6" stroke-width="1.5" opacity="0.6" />

    <g stroke="#153a5c" stroke-width="3" opacity="0.75">
      <line x1="0" y1="-72" x2="0" y2="-58" />
      <line x1="0" y1="72" x2="0" y2="58" transform="rotate(180)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(45)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(90)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(135)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-45)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-90)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-135)" />
    </g>

    <g transform="rotate(-35)">
      <line x1="0" y1="10" x2="0" y2="-56" stroke="#c24a76" stroke-width="4" stroke-linecap="round" />
    </g>
    <circle r="7" fill="#153a5c" />
  </g>

  <!-- wordmark (foreground / medium-grey) -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="270" y="130" fill="#15212e" font-size="56" font-weight="700" letter-spacing="2">
      AI PM COCKPIT
    </text>
    <text x="272" y="168" fill="#7d8a97" font-size="22" font-weight="400" letter-spacing="1">
      Plan. Track. Steer your projects.
    </text>
  </g>

  <!-- status dots (RAG-style accent, decorative) -->
  <g transform="translate(272,190)">
    <circle cx="0" cy="0" r="5" fill="#2bc4b6" />
    <circle cx="24" cy="0" r="5" fill="#5f57a8" />
    <circle cx="48" cy="0" r="5" fill="#c24a76" opacity="0.8" />
  </g>
</svg>
