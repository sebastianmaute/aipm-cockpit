<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI PM Cockpit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AI PM Cockpit — Beacon theme</title>

  <defs>
    <style>
      :root {
        --ui-dark-blue: #003459;
        --ui-green: #68bd00;
        --background: #ffffff;
        --surface: #ffffff;
        --foreground: #646461;
        --rag-red: #d95842;
        --rag-amber: #f4c11c;
        --rag-green: #41a700;
        --ui-pink: #e84663;
        --ui-purple: #ae448c;
        --ui-blue: #5daee0;
        --ui-medium-grey: #929499;
        --ui-light-grey: #e2e6e7;
        --surface-muted: #e2e6e7;
        --line: #e2e6e7;
      }
    </style>
  </defs>

  <!-- HUD grid lines (line color) -->
  <g stroke="var(--line)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="900" y1="0" x2="900" y2="280" />
  </g>

  <!-- right-side abstract cockpit arcs (green / purple accents) -->
  <g fill="none" stroke="var(--ui-blue)" stroke-width="2">
    <circle cx="1030" cy="140" r="150" opacity="0.12" />
    <circle cx="1030" cy="140" r="105" opacity="0.20" />
    <circle cx="1030" cy="140" r="60" opacity="0.30" />
  </g>
  <g fill="none" stroke="var(--ui-purple)" stroke-width="1.5" opacity="0.30">
    <path d="M 950 60 A 120 120 0 0 1 1110 100" />
    <path d="M 960 220 A 120 120 0 0 0 1120 175" />
  </g>

  <!-- cockpit gauge icon (dark-blue ring, pink needle) -->
  <g transform="translate(150,140)">
    <circle r="72" fill="none" stroke="var(--ui-dark-blue)" stroke-width="5" />
    <circle r="72" fill="none" stroke="var(--ui-blue)" stroke-width="1.5" opacity="0.6" />

    <g stroke="var(--ui-dark-blue)" stroke-width="3" opacity="0.75">
      <line x1="0" y1="-72" x2="0" y2="-58" />
      <line x1="0" y1="72" x2="0" y2="58" transform="rotate(180)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(45)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(90)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(135)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-45)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-90)" />
      <line x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-135)" />
    </g>

    <g transform="rotate(-35)">
      <line x1="0" y1="10" x2="0" y2="-56" stroke="var(--ui-pink)" stroke-width="4" stroke-linecap="round" />
    </g>
    <circle r="7" fill="var(--ui-dark-blue)" />
  </g>

  <!-- wordmark (foreground / medium-grey) -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="270" y="130" fill="var(--ui-dark-blue)" font-size="56" font-weight="700" letter-spacing="2">
      AI PM COCKPIT
    </text>
    <text x="272" y="168" fill="var(--foreground)" font-size="22" font-weight="400" letter-spacing="1">
      Plan. Track. Steer your projects.
    </text>
  </g>

  <!-- status dots (RAG-style accent, decorative) -->
  <g transform="translate(272,190)">
    <circle cx="0" cy="0" r="5" fill="var(--ui-blue)" />
    <circle cx="24" cy="0" r="5" fill="var(--ui-purple)" />
    <circle cx="48" cy="0" r="5" fill="var(--ui-pink)" opacity="0.8" />
  </g>
</svg>
