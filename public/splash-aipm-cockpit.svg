<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"
     role="img" aria-label="AI PM Cockpit is starting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AI PM Cockpit — starting</title>
  <desc>Instrument gauge with a rotating scan arc, the AI PM Cockpit wordmark and tagline.</desc>

  <style>
    /* Base styles are the RESTING state. Entrance keyframes animate *from* the
       off state, so with animations disabled the file renders correctly. */
    .grid line   { stroke: #e2e6e7; stroke-width: 1; opacity: .12; }
    .ring        { fill: none; stroke: #5daee0; }
    .arc         { fill: none; stroke: #ae448c; stroke-width: 1.5; opacity: .35; }
    .dial        { fill: none; stroke: #5daee0; stroke-width: 5; }
    .dial-hair   { fill: none; stroke: #ffffff; stroke-width: 1; opacity: .4; }
    .tick        { stroke: #ffffff; stroke-width: 3; opacity: .85; }
    .needle      { stroke: #e84663; stroke-width: 4; stroke-linecap: round; }
    .hub         { fill: #ffffff; }
    .scan        { fill: none; stroke: #5daee0; stroke-width: 3; stroke-linecap: round;
                   opacity: .55; }
    .wordmark    { fill: #ffffff; font-size: 34px; font-weight: 700; letter-spacing: 2px; }
    .tagline     { fill: #e2e6e7; font-size: 15px; letter-spacing: .5px; }
    .dot         { transform-box: fill-box; transform-origin: center; }

    /* pivots resolve against the viewBox, not a bounding box */
    .needle, .scan, .ring { transform-box: view-box; transform-origin: 320px 168px; }

    /* --- entrance (plays once) --- */
    .grid line { animation: fade .5s ease-out both; }
    .ring      { animation: ring .7s cubic-bezier(.2,.7,.2,1) both; }
    .arc       { animation: fade .6s .35s ease-out both; }
    .dial      { stroke-dasharray: 452.4; animation: draw .7s .15s cubic-bezier(.3,.7,.2,1) both; }
    .dial-hair { animation: fade .4s .5s ease-out both; }
    .tick      { animation: fade .25s ease-out both; }
    .needle    { animation: sweep .8s .25s cubic-bezier(.15,.85,.25,1) both; }
    .hub       { animation: pop .3s .9s cubic-bezier(.2,1.4,.4,1) both; }
    .wordmark  { animation: rise .6s .85s cubic-bezier(.2,.7,.2,1) both; }
    .tagline   { animation: rise .6s 1s cubic-bezier(.2,.7,.2,1) both; }

    /* ticks illuminate in the needle's wake */
    .tick:nth-of-type(1) { animation-delay: .60s }
    .tick:nth-of-type(2) { animation-delay: .66s }
    .tick:nth-of-type(3) { animation-delay: .72s }
    .tick:nth-of-type(4) { animation-delay: .78s }
    .tick:nth-of-type(5) { animation-delay: .84s }
    .tick:nth-of-type(6) { animation-delay: .90s }
    .tick:nth-of-type(7) { animation-delay: .96s }
    .tick:nth-of-type(8) { animation-delay: 1.02s }

    /* --- steady state (loops seamlessly for as long as the boot takes) --- */
    .scan { animation: scan-in .5s 1.1s ease-out both, scan 2.6s 1.1s linear infinite; }
    .dot  { animation: dot 1.9s 1.25s ease-in-out infinite both; }
    .dot:nth-of-type(2) { animation-delay: 1.45s }
    .dot:nth-of-type(3) { animation-delay: 1.65s }

    @keyframes fade    { from { opacity: 0 } }
    @keyframes ring    { from { opacity: 0; transform: scale(.94) } }
    @keyframes draw    { from { stroke-dashoffset: 452.4 } to { stroke-dashoffset: 0 } }
    @keyframes sweep   { from { transform: rotate(-100deg) } }
    @keyframes pop     { from { opacity: 0; transform: scale(0) } }
    @keyframes rise    { from { opacity: 0; transform: translateY(6px) } }
    @keyframes scan-in { from { opacity: 0 } }
    @keyframes scan    { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    @keyframes dot     { 0%, 100% { opacity: .35; transform: scale(.85) }
                         45%      { opacity: 1;   transform: scale(1) } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dial { stroke-dasharray: none; }
      .scan { opacity: .4; }
    }
  </style>

  <rect width="640" height="400" fill="#003459"/>

  <g class="grid">
    <line x1="0" y1="56" x2="640" y2="56"/>
    <line x1="0" y1="358" x2="640" y2="358"/>
    <line x1="140" y1="0" x2="140" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>

  <circle class="ring" cx="320" cy="168" r="150" stroke-width="2" opacity=".10"/>
  <circle class="ring" cx="320" cy="168" r="105" stroke-width="2" opacity=".18"/>

  <path class="arc" d="M 207.24 126.96 A 120 120 0 0 1 278.96 55.24"/>
  <path class="arc" d="M 432.76 209.04 A 120 120 0 0 1 361.04 280.76"/>

  <circle class="scan" cx="320" cy="168" r="88" stroke-dasharray="102 451"/>

  <circle class="dial" cx="320" cy="168" r="72"/>
  <circle class="dial-hair" cx="320" cy="168" r="72"/>

  <g transform="translate(320,168)">
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58"/>
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58" transform="rotate(45)"/>
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58" transform="rotate(90)"/>
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58" transform="rotate(135)"/>
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58" transform="rotate(180)"/>
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-135)"/>
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-90)"/>
    <line class="tick" x1="0" y1="-72" x2="0" y2="-58" transform="rotate(-45)"/>
  </g>

  <!-- geometry is already at the resting -35°; CSS adds the -100° entrance sweep -->
  <line class="needle" x1="325.74" y1="176.19" x2="287.88" y2="122.13"/>
  <circle class="hub" cx="320" cy="168" r="7"/>

  <g font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" text-anchor="middle">
    <text class="wordmark" x="320" y="272">AI PM COCKPIT</text>
    <text class="tagline" x="320" y="300">Plan. Track. Steer your projects.</text>
  </g>

  <g>
    <circle class="dot" cx="296" cy="330" r="5" fill="#5daee0"/>
    <circle class="dot" cx="320" cy="330" r="5" fill="#ae448c"/>
    <circle class="dot" cx="344" cy="330" r="5" fill="#e84663" opacity=".7"/>
  </g>
</svg>
